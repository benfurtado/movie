services:
  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit
    command:
      - --dev
      - --node-ip
      - ${PUBLIC_IP:-127.0.0.1}
      - --udp-port
      - 50000-50050
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecret}"
    ports:
      - "7880:7880/tcp"
      - "7881:7881/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "50000-50050:50000-50050/udp"
    restart: unless-stopped

